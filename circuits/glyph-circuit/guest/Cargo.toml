[package]
name = "glyph-circuit-guest"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "glyph-circuit-guest"
path = "src/main.rs"

# Isolate from parent workspace — risc0-build compiles the guest with a
# different target triple (riscv32im-risc0-zkvm-elf) and its own dep
# resolution. Inheriting workspace state breaks the embedded compile.
[workspace]

[dependencies]
risc0-zkvm = { version = "1.2", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
borsh = { version = "0.10", default-features = false }
# risc0-build runs `cargo metadata` on the guest THROUGH the host's `guest`
# symlink (circuits/glyph-circuit/host/guest -> ../guest), resolving this path
# lexically from that symlink location — NOT from the real guest/ dir. From
# host/guest that is four levels up to the repo root (guest -> host ->
# glyph-circuit -> circuits -> root), so this is `../../../../common`, not
# `../../../common` (which resolved to circuits/common and broke CI). An absolute
# path also worked locally but was non-portable.
glyph-common = { path = "../../../../common" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
