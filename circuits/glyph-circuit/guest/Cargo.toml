[package]
name = "glyph-circuit-guest"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "glyph-circuit-guest"
path = "src/main.rs"

# Standalone workspace: the guest is built for the riscv32im-risc0-zkvm-elf
# target by risc0-build, isolated from the host workspace's dependency graph.
[workspace]

[dependencies]
# Relative path so the build is portable across machines/CI (was previously an
# absolute path that broke risc0-build's `cargo metadata` on other hosts).
glyph-common = { path = "../../../common" }
risc0-zkvm = { version = "1.2", default-features = false, features = ["std"] }

[profile.release]
# Reproducible guest builds.
opt-level = 3
