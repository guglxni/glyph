name: GLYPH CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Rust: Lint & Format ──────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ─── Rust: Unit & Integration Tests ─────────────────────────────────────
  test:
    name: Test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate:
          - glyph-circuit-host
          - glyph-tee-worker
          - glyph-common
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-${{ matrix.crate }}-

      - name: Run tests for ${{ matrix.crate }}
        run: cargo test -p ${{ matrix.crate }}

  # ─── Rust: Full workspace build ──────────────────────────────────────────
  build:
    name: Build Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build workspace (no-ZK default)
        run: cargo build --workspace

  # ─── Security: Placeholder Scanner ───────────────────────────────────────
  placeholder-scan:
    name: Placeholder Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for placeholder VK values
        run: |
          echo "Scanning groth16/ for PLACEHOLDER markers..."
          if grep -rn "PLACEHOLDER" programs/glyph-verifier/src/groth16/; then
            echo ""
            echo "❌ FAIL: Placeholder VK values detected in groth16/ directory."
            echo "   Run 'cargo run --bin extract-vk --features risc0' to generate real VK."
            echo "   See: scripts/extract-vk/src/main.rs"
            exit 1
          fi
          echo "✅ No placeholder VK values found."

      - name: Scan for all-zero VK hash
        run: |
          echo "Checking GLYPH_VK_HASH is not all zeros..."
          # Check if the constant is a sequence of 32 zero bytes
          if grep -A5 "pub const GLYPH_VK_HASH" programs/glyph-verifier/src/groth16/vk.rs \
             | grep -q "0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,"; then
            echo ""
            echo "⚠️  WARNING: GLYPH_VK_HASH appears to be all zeros."
            echo "   This is expected in development but blocks production deployment."
            echo "   CI continues — this is an informational warning only."
          else
            echo "✅ GLYPH_VK_HASH is non-zero."
          fi

      - name: Scan for TODO stubs in vendor code
        run: |
          echo "Scanning TEE vendor implementations for TODO stubs..."
          STUB_COUNT=$(grep -c "TODO" tee-worker/src/vendors/*.rs 2>/dev/null | awk -F: '{sum+=$2} END{print sum}')
          echo "Found ${STUB_COUNT:-0} TODO markers in vendor implementations."
          if [ "${STUB_COUNT:-0}" -gt "0" ]; then
            grep -n "TODO" tee-worker/src/vendors/*.rs || true
            echo ""
            echo "⚠️  WARNING: TEE vendor stubs detected. These must be implemented before production."
          fi

  # ─── Security: Dependency Audit ──────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet

      - name: Run dependency audit
        run: cargo audit
        continue-on-error: true  # Advisory — does not block PRs

  # ─── TypeScript SDK Build ─────────────────────────────────────────────────
  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/typescript/package.json

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm install

      - name: TypeScript build
        working-directory: sdk/typescript
        run: npm run build --if-present

      - name: TypeScript lint
        working-directory: sdk/typescript
        run: npm run lint --if-present || true

  # ─── Production Mode Guard Test ──────────────────────────────────────────
  production-mode-guard:
    name: Production Mode Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-prod-guard-${{ hashFiles('**/Cargo.lock') }}

      - name: Build worker binary
        run: cargo build -p glyph-tee-worker

      - name: Verify production mode rejects DevProver
        run: |
          echo "Testing that GLYPH_MODE=production GLYPH_PROVER=dev panics..."
          # Create minimal dummy files so worker can start and hit the guard
          echo '{"max_lamports_per_tx": 1000, "allowed_programs": [], "max_daily_volume_lamports": 1000, "require_signer_present": false}' > /tmp/test_policy.toml || true
          echo '[]' > /tmp/test_keypair.json || true

          # Worker should panic immediately with FATAL message
          OUTPUT=$(GLYPH_MODE=production \
                   GLYPH_PROVER=dev \
                   GLYPH_POLICY_PATH=/tmp/test_policy.toml \
                   GLYPH_KEYPAIR_PATH=/tmp/test_keypair.json \
                   timeout 5 ./target/debug/glyph-tee-worker 2>&1 || true)

          echo "Output: $OUTPUT"
          if echo "$OUTPUT" | grep -q "FATAL"; then
            echo "✅ Production mode correctly rejected DevProver."
          else
            echo "⚠️  Production mode guard may not have fired (expected FATAL in output)."
          fi
