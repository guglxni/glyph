[package]
name = "glyph-e2e-devnet"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate (NOT a member of the root workspace) so its solana-sdk 2.x /
# anchor-free dependency graph does not collide with the on-chain program's
# pinned solana-program 1.18.x.
[workspace]

[[bin]]
name = "e2e"
path = "src/main.rs"

[dependencies]
solana-client = "1.18"
solana-sdk = "1.18"
borsh = "0.10"
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
glyph-common = { path = "../../common" }
