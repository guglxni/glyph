# Standalone helper crate (its own workspace) that bootstraps the on-chain VK
# governance: it submits `initialize` (creates the VerifierConfig PDA) and
# `initialize_vk_multisig` (creates the VkMultisig PDA) on devnet.
#
# Kept OUT of the root workspace so its solana-client/solana-sdk dependency
# graph (pinned to the 1.18.26 line to match the program's
# `solana-program = "=1.18.26"` / anchor 0.30.1) does not perturb the main
# build.
#
# Instructions are constructed by hand (anchor 8-byte discriminator +
# Borsh-encoded args) so this crate does NOT depend on the program crate or its
# anchor-generated `accounts`/`instruction` modules.
[package]
name = "init-multisig"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "init-multisig"
path = "src/main.rs"

[dependencies]
# Pin the whole Solana client graph to the 1.18.26 line. Without exact pins
# cargo resolves solana-sdk/solana-client to the 3.x line, which links a
# conflicting solana-program 2.x native lib.
solana-client = "=1.18.26"
solana-sdk = "=1.18.26"
borsh = "0.10"
sha2 = "0.10"
anyhow = "1"
