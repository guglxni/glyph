[package]
name = "extract-vk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "extract-vk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
glyph-common = { path = "../../common" }
glyph-circuit-host = { path = "../../circuits/glyph-circuit/host" }
hex = "0.4"
sha2 = "0.10"

# Optional — only pulled in by the real `--features risc0` extraction path.
risc0-zkvm = { version = "1.2", features = ["prove", "unstable"], optional = true }
risc0-groth16 = { version = "1.2", features = ["unstable"], optional = true }

# Arkworks types we need to walk the VK and serialize each affine point
# in Solana's alt_bn128 big-endian layout. Only pulled in by --features risc0.
ark-bn254 = { version = "0.4", optional = true }
ark-ec = { version = "0.4", optional = true }
ark-ff = { version = "0.4", optional = true }
ark-serialize = { version = "0.4", optional = true }
ark-groth16 = { version = "0.4", optional = true }

[features]
default = []
risc0 = [
    "dep:risc0-zkvm",
    "dep:risc0-groth16",
    "dep:ark-bn254",
    "dep:ark-ec",
    "dep:ark-ff",
    "dep:ark-serialize",
    "dep:ark-groth16",
    "glyph-circuit-host/risc0",
]
